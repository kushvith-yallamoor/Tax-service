# Application Log Level
logging:
  level:
    com.blockstats: DEBUG
    root: ERROR
# Spring Configuration to load Keys from Secret Manager
spring:
  config:
    import: sm://
  cloud:
    gcp:
      storage:
        bucket-name: dev-prj-frontend-apps-tax-reports
# App Configurations
tax:
  app:
    allowed-cross-origin-mapping: '/v1/**'
    allowed-cross-origins: 'http://localhost:4545,https://frontend-web-uw6myk4s3a-uc.a.run.app,https://beta.blockstats.app'
# Mongo Configurations
blockstats:
  userdata:
    mongodb:
      suffix: '?retryWrites=true&w=majority&appName=userdata-dev'
      replicaSet: blockstats-dev.e4vcwlf.mongodb.net
      userName: blockstats-dev
      database: userdata-dev
  coinprices:
    mongodb:
      suffix: '?retryWrites=true&w=majority&appName=blockstats-coinpricing'
      replicaSet: blockstats-coinpricing.rtf55ca.mongodb.net
      userName: blockstats-app
      database: coin-pricing

dex:
  client:
    baseUrl: https://defi-pricing-service-182856317969.us-central1.run.app/blockstats/defipricing

wallet:
  client:
    baseUrl: https://wallet-service-uw6myk4s3a-uc.a.run.app/blockstats/walletservice
# Tracking Service HTTP Configurations
tracking:
  httpclient:
    baseUrl: https://tracking-service-182856317969.us-central1.run.app
    defaultMaxPerRoute: 10
    maxTotal: 10
    ioThreadCount: 10
# User Service HTTP Configurations
user:
  httpclient:
    baseUrl: https://user-service-182856317969.us-central1.run.app
    defaultMaxPerRoute: 10
    maxTotal: 10
    ioThreadCount: 10
# Payment Service HTTP Configurations
payment:
  httpclient:
    baseUrl: https://payment-service-182856317969.us-central1.run.app
    defaultMaxPerRoute: 10
    maxTotal: 10
    ioThreadCount: 10