# Spring Configuration to load Keys from Secret Manager
spring:
  config:
    import: sm://
  cloud:
    gcp:
      storage:
        bucket-name: dsit-prj-backend-services-tax-reports
# App Configurations
tax:
  app:
    allowed-cross-origin-mapping: '/v1/**'
    allowed-cross-origins: 'https://blockstats.app'
# Mongo Configurations
blockstats:
  userdata:
    mongodb:
      suffix: '?retryWrites=true&w=majority&appName=blockstats-cluster-dsit'
      replicaSet: blockstats-cluster-dsit.8lvidsf.mongodb.net
      userName: blockstats-app
      database: userdata
  coinprices:
    mongodb:
      suffix: '?retryWrites=true&w=majority&appName=blockstats-coinpricing'
      replicaSet: blockstats-coinpricing.rtf55ca.mongodb.net
      userName: blockstats-app
      database: coin-pricing

dex:
  client:
    baseUrl: https://defi-pricing-service-594081517864.us-central1.run.app/blockstats/defipricing

wallet:
  client:
    baseUrl: https://wallet-service-uw6myk4s3a-uc.a.run.app/blockstats/walletservice
# Tracking Service HTTP Configurations
tracking:
  httpclient:
    baseUrl: https://tracking-service-1065610358793.us-east5.run.app
    defaultMaxPerRoute: 10
    maxTotal: 10
    ioThreadCount: 10
# User Service HTTP Configurations
user:
  httpclient:
    baseUrl: https://user-service-1065610358793.us-east5.run.app
    defaultMaxPerRoute: 10
    maxTotal: 10
    ioThreadCount: 10