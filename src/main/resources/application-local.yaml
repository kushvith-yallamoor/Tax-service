# App Configurations
tax:
  app:
    allowed-cross-origin-mapping: '/v1/**'
    allowed-cross-origins: '*'
# Spring Configuration - no Secret Manager, no other project: everything lives in frontend-new-dev
spring:
  cloud:
    gcp:
      project-id: frontend-new-dev
      pubsub:
        project-id: frontend-new-dev
      storage:
        project-id: frontend-new-dev
        bucket-name: blockstats-static-assets
# Mongo Configurations - our own Atlas M0 cluster, hardcoded (no Secret Manager)
blockstats:
  userdata:
    mongodb:
      suffix: '?retryWrites=true&w=majority'
      replicaSet: blockstats-cluster-dsit.8lvidsf.mongodb.net
      userName: blockstats-app
      key: "Awdrgy45$$45qazwsxpoi"
      database: userdata
  coinprices:
    mongodb:
      suffix: '?retryWrites=true&w=majority&appName=blockstats-coinpricing'
      replicaSet: blockstats-coinpricing.rtf55ca.mongodb.net
      userName: blockstats-app
      key: "Awdrgy45$$45qazwsxpoi"
      database: coin-pricing

dex:
  client:
    baseUrl: https://defi-pricing-service-182856317969.us-central1.run.app/blockstats/defipricing

wallet:
  client:
    baseUrl: https://wallet-service-182856317969.us-central1.run.app/blockstats/walletservice
# Tracking Service HTTP Configurations
tracking:
  httpclient:
    baseUrl: https://tracking-service-182856317969.us-central1.run.app
    defaultMaxPerRoute: 10
    maxTotal: 10
    ioThreadCount: 10
# User Service HTTP Configurations
user:
  httpclient:
    baseUrl: https://user-service-182856317969.us-central1.run.app
    defaultMaxPerRoute: 10
    maxTotal: 10
    ioThreadCount: 10
# Payment Service HTTP Configurations
payment:
  httpclient:
    baseUrl: https://payment-service-182856317969.us-central1.run.app
    defaultMaxPerRoute: 10
    maxTotal: 10
    ioThreadCount: 10
# AI Service HTTP Configurations
ai:
  httpclient:
    baseUrl: https://ai-service-182856317969.us-central1.run.app
    defaultMaxPerRoute: 10
    maxTotal: 10
    ioThreadCount: 10
  api:
    label-resource: /blockstats/ai/v1/label/{chainName}/{txHash}
    form1099-da-parse-resource: /blockstats/ai/v1/1099da/parse
