# App Configurations
tax:
  app:
    allowed-cross-origin-mapping: '/v1/**'
    allowed-cross-origins: '*'
# Spring Configuration
spring:
  config:
    import: sm://
  cloud:
    gcp:
      project-id: dev-prj-frontend-apps
      credentials:
        location: 'classpath:application_default_credentials.json'
      # The blockstats-tracking Pub/Sub topic lives in frontend-new-dev (this service's own
      # Cloud Run project), not dev-prj-frontend-apps (the default above, used for
      # Secret Manager/Storage). Without this override, every status publish
      # (IN_PROGRESS/COMPLETED_SUCCESSFULLY/COMPLETED_WITH_ERRORS) fails with a
      # Pub/Sub NOT_FOUND error that publishStatusSafely() swallows, leaving requests
      # stuck at PUBLISHED forever regardless of whether the actual work succeeds.
      pubsub:
        project-id: frontend-new-dev
      secretmanager:
        project-id: dev-prj-frontend-apps
        credentials:
          location: 'classpath:application_default_credentials.json'
      storage:
        project-id: dev-prj-frontend-apps
        bucket-name: dev-prj-frontend-apps-tax-reports
        credentials:
          location: 'classpath:application_default_credentials.json'
# Mongo Configurations - our own Atlas M0 cluster, hardcoded (no Secret Manager)
blockstats:
  userdata:
    mongodb:
      suffix: '?retryWrites=true&w=majority'
      replicaSet: blockstats-cluster-dsit.8lvidsf.mongodb.net
      userName: blockstats-app
      key: "Awdrgy45$$45qazwsxpoi"
      database: userdata
  coinprices:
    mongodb:
      suffix: '?retryWrites=true&w=majority'
      replicaSet: blockstats-cluster-dsit.8lvidsf.mongodb.net
      userName: blockstats-app
      key: "Awdrgy45$$45qazwsxpoi"
      database: coin-pricing

